<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exhale Memorials — Front Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --slate:#2B2D37;
    --slate-soft:#3B3E4A;
    --green:#20C997;
    --green-deep:#189873;
    --cream:#F3EEE8;
    --card:#FFFFFF;
    --ink:#2B2D37;
    --ink-soft:#6B6F7B;
    --hairline:#E7E2D8;
    --amber:#C98A20;
    --amber-pale:#F7ECD8;
    --rust:#B5493A;
    --rust-pale:#F5E1DD;
    --shadow: 0 1px 2px rgba(43,45,55,0.05), 0 10px 28px rgba(43,45,55,0.07);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Nunito', sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .shell{ min-height:100vh; display:flex; flex-direction:column; }

  header{
    background: var(--slate);
    color:#F3EEE8;
    padding: 18px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
  }
  .brand-mark svg{ width:100%; height:100%; }
  .brand-name{ font-family:'Poppins', sans-serif; font-weight:700; font-size:19px; letter-spacing:0.2px; }
  .brand-name span{ color: var(--green); }
  .brand-sub{ font-size:11px; color:#B9BAC4; letter-spacing:0.8px; text-transform:uppercase; margin-top:1px; }
  .header-right{ display:flex; align-items:center; gap:18px; }
  .clock{ text-align:right; }
  .clock .time{ font-family:'Poppins', sans-serif; font-weight:700; font-size:20px; }
  .clock .date{ font-size:11px; color:#B9BAC4; }
  .sync-pill{
    font-size:11px; font-weight:700;
    background: rgba(32,201,151,0.15);
    color: var(--green);
    padding:6px 12px;
    border-radius:20px;
    display:flex; align-items:center; gap:6px;
  }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--green); animation: pulse 2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .refresh-btn{
    background: none; border:1px solid rgba(255,255,255,0.25); color:#F3EEE8;
    font-family:'Nunito',sans-serif; font-weight:700; font-size:11.5px;
    padding:7px 13px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .refresh-btn:hover{ background: rgba(255,255,255,0.08); }
  .refresh-btn:disabled{ opacity:0.5; cursor:default; }

  main{ flex:1; padding: 26px 32px 40px; max-width:1400px; margin:0 auto; width:100%; }

  .error-banner{
    background: var(--rust-pale); color:var(--rust); border-radius:10px;
    padding:10px 14px; font-size:12.5px; margin-bottom:18px; display:none;
  }

  .stat-row{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:16px;
    margin-bottom:22px;
  }
  .stat-card{
    background: var(--card);
    border-radius:14px;
    box-shadow: var(--shadow);
    padding:18px 20px;
    border-left: 4px solid var(--green);
  }
  .stat-card.attention{ border-left-color: var(--amber); }
  .stat-label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px; }
  .stat-value{ font-family:'Poppins', sans-serif; font-size:30px; font-weight:700; margin-top:6px; }
  .stat-foot{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }

  .grid{
    display:grid;
    grid-template-columns: 1.5fr 1fr;
    gap:18px;
  }
  .panel{
    background: var(--card);
    border-radius:16px;
    box-shadow: var(--shadow);
    padding:22px;
  }
  .panel-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:16px;
  }
  .panel-title{ font-family:'Poppins', sans-serif; font-size:16.5px; font-weight:700; }
  .panel-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .count-pill{
    background: var(--cream); border:1px solid var(--hairline);
    font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:20px; color:var(--ink-soft);
  }

  .lead-row{
    display:flex; align-items:center; gap:14px;
    padding:13px 0;
    border-bottom:1px solid var(--hairline);
  }
  .lead-row:last-child{ border-bottom:none; }
  .lead-avatar{
    width:38px; height:38px; border-radius:50%;
    background: var(--slate); color:#fff;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:14px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .lead-main{ flex:1; min-width:0; }
  .lead-name{ font-weight:700; font-size:13.5px; }
  .lead-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .lead-right{ text-align:right; flex-shrink:0; }
  .lead-time{ font-size:11px; color:var(--ink-soft); font-weight:600; }
  .lead-stage{
    display:inline-block; margin-top:5px;
    font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px;
    background: var(--cream); color:var(--ink-soft); border:1px solid var(--hairline);
  }
  .lead-stage.hot{ background: rgba(32,201,151,0.12); color: var(--green-deep); border-color: transparent; }

  .attn-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--hairline);
  }
  .attn-row:last-child{ border-bottom:none; }
  .attn-dot{ width:9px; height:9px; border-radius:50%; background:var(--amber); flex-shrink:0; }
  .attn-dot.overdue{ background: var(--rust); }
  .attn-main{ flex:1; min-width:0; }
  .attn-name{ font-weight:700; font-size:13px; }
  .attn-meta{ font-size:11px; color:var(--ink-soft); margin-top:1px; }
  .attn-days{ font-size:11px; font-weight:800; color:var(--amber); text-align:right; }
  .attn-days.overdue{ color:var(--rust); }

  .empty-state{ padding:30px 0; text-align:center; color:var(--ink-soft); font-size:13px; }

  footer{
    text-align:center; font-size:11px; color:var(--ink-soft);
    padding: 6px 0 20px;
  }

  @media (max-width: 980px){
    .stat-row{ grid-template-columns: 1fr 1fr; }
    .grid{ grid-template-columns: 1fr; }
  }

  /* Password gate */
  #gate{
    position:fixed; inset:0; z-index:999;
    background: var(--slate);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:18px;
  }
  #gate .gate-mark{ width:52px; height:52px; }
  #gate .gate-title{ font-family:'Poppins', sans-serif; color:#F3EEE8; font-size:20px; font-weight:700; }
  #gate .gate-title span{ color:var(--green); }
  #gate form{ display:flex; flex-direction:column; gap:12px; width:260px; }
  #gate input{
    padding:12px 14px; border-radius:9px; border:1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06); color:#F3EEE8; font-family:'Nunito',sans-serif; font-size:14px;
  }
  #gate input::placeholder{ color:#9A9CA8; }
  #gate button{
    padding:12px 14px; border-radius:9px; border:none;
    background: var(--green); color:#12241D; font-weight:800; font-size:13.5px;
    cursor:pointer; font-family:'Nunito',sans-serif;
  }
  #gate button:hover{ background: var(--green-deep); color:#fff; }
  #gate .gate-error{ color:#E6A79A; font-size:12px; text-align:center; min-height:16px; }
  .shell{ display:none; }
</style>
</head>
<body>
<div id="gate">
  <svg class="gate-mark" viewBox="0 0 100 100" fill="none">
    <path d="M55 30 L75 30 L75 10" stroke="#20C997" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 45 L60 45 L60 25" stroke="#20C997" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="gate-title">exhale<span>.</span>memorials — Front Desk</div>
  <form id="gateForm">
    <input type="password" id="gatePassword" placeholder="Enter password" autofocus>
    <button type="submit">Unlock</button>

</div>
<div class="shell">
  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M55 30 L75 30 L75 10" stroke="#20C997" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M40 45 L60 45 L60 25" stroke="#20C997" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">exhale<span>.</span>memorials</div>
        <div class="brand-sub">Front Desk Monitor</div>
      </div>
    </div>
    <div class="header-right">
      <div class="sync-pill"><span class="sync-dot"></span><span id="syncText">Live</span></div>
      <button class="refresh-btn" id="refreshBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 2v6h-6M3 22v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L21 8M20.5 15a9 9 0 0 1-14.9 3.4L3 16"/></svg>
        Refresh
      </button>
      <div class="clock">

          <div>
            <div class="panel-title">Incoming Leads</div>
            <div class="panel-sub">Most recent enquiries, newest first</div>
          </div>

        </div>
        <div id="leadsList"></div>

      <div class="panel">
        <div class="panel-head">

          </div>

<script>
// --- Password gate (client-side deterrent, not high-security auth) ---
const GATE_HASH = "4211959d8e2e6925f3b25decac2e4f0f35b7322caab26fb2ee7b0e07e7fde135";
async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}
function showApp(){
  document.getElementById("gate").style.display = "none";
  document.querySelector(".shell").style.display = "flex";
}
if(sessionStorage.getItem("exhale_desk_unlocked") === "1"){
  showApp();
}
document.getElementById("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const val = document.getElementById("gatePassword").value;
  const hash = await sha256(val);
  if(hash === GATE_HASH){
    sessionStorage.setItem("exhale_desk_unlocked", "1");
    showApp();
  }else{
    document.getElementById("gateError").textContent = "Incorrect password";
    document.getElementById("gatePassword").value = "";
  }
});

const PIPEDRIVE_MCP_URL = "https://mcp.pipedrive.ai/mcp";
const REFRESH_INTERVAL_MS = 15 * 60 * 1000; // 15 minutes
const fmt = n => "R " + Number(n).toLocaleString("en-ZA", {maximumFractionDigits:0});

function initials(name){
  return (name||"?").split(" ").filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
}
function timeAgo(iso){
  if(!iso) return "—";
  const diff = (Date.now() - new Date(iso).getTime())/1000;
  if(diff < 60) return "just now";
  if(diff < 3600) return Math.floor(diff/60) + "m ago";
  if(diff < 86400) return Math.floor(diff/3600) + "h ago";
  return Math.floor(diff/86400) + "d ago";
}
function cleanStageName(name){
  return (name||"").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u2705\u2709]/gu,"").trim();
}

function tickClock(){
  const now = new Date();
  document.getElementById("clockTime").textContent = now.toLocaleTimeString("en-ZA", {hour:"2-digit", minute:"2-digit"});
  document.getElementById("clockDate").textContent = now.toLocaleDateString("en-ZA", {weekday:"long", day:"numeric", month:"long"});
}
tickClock();
setInterval(tickClock, 1000 * 30);

function computeAndRender(deals, stages){
  const realDeals = deals.filter(d => !(d.title || "").startsWith("[Sample]"));
  const open = realDeals.filter(d => d.status === "open");
  const won = realDeals.filter(d => d.status === "won");

  const stageById = {};
  stages.forEach(s => stageById[s.id] = s);

  // Today / this week counts
  const now = Date.now();
  const dayMs = 86400000;
  const today = realDeals.filter(d => (now - new Date(d.add_time).getTime()) < dayMs);
  const week = realDeals.filter(d => (now - new Date(d.add_time).getTime()) < dayMs*7);
  const openValue = open.reduce((s,d)=>s+(d.value||0),0);

  // Needs follow-up: open deals in a stage where rot is enabled, ranked by how long they've sat
  const followUp = open
    .map(d => {
      const stage = stageById[d.stage_id];
      if(!stage || !stage.is_deal_rot_enabled) return null;
      const sinceStage = d.stage_change_time || d.add_time;
      const daysInStage = (now - new Date(sinceStage).getTime()) / dayMs;
      return { deal: d, stage, daysInStage, threshold: stage.days_to_rotten || 999 };
    })
    .filter(Boolean)
    .sort((a,b) => (b.daysInStage/b.threshold) - (a.daysInStage/a.threshold));

  // Stat row
  document.getElementById("statRow").innerHTML = `
    <div class="stat-card">
      <div class="stat-label">New Today</div>
      <div class="stat-value">${today.length}</div>
      <div class="stat-foot">${week.length} in the last 7 days</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Open Deals</div>
      <div class="stat-value">${open.length}</div>
      <div class="stat-foot">${fmt(openValue)} in active pipeline</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Closed Won</div>
      <div class="stat-value">${won.length}</div>
      <div class="stat-foot">since records began</div>
    </div>
    <div class="stat-card attention">
      <div class="stat-label">Needs Follow-Up</div>
      <div class="stat-value">${followUp.filter(f=>f.daysInStage >= f.threshold).length}</div>
      <div class="stat-foot">overdue in their current stage</div>
    </div>
  `;

  // Incoming leads — newest first
  const recent = [...realDeals].sort((a,b) => new Date(b.add_time) - new Date(a.add_time)).slice(0,8);
  document.getElementById("leadsPill").textContent = recent.length;
  document.getElementById("leadsList").innerHTML = recent.length ? recent.map(d => {
    const stage = stageById[d.stage_id];
    const isNew = (now - new Date(d.add_time).getTime()) < dayMs;
    return `<div class="lead-row">
      <div class="lead-avatar">${initials(d.title)}</div>
      <div class="lead-main">
        <div class="lead-name">${d.title}</div>
        <div class="lead-meta">${d.value ? fmt(d.value) : "Value TBC"}${d.channel_id ? " · " + d.channel_id : ""}</div>
      </div>
      <div class="lead-right">
        <div class="lead-time">${timeAgo(d.add_time)}</div>
        <div class="lead-stage ${isNew ? "hot" : ""}">${stage ? cleanStageName(stage.name) : "—"}</div>
      </div>
    </div>`;
  }).join("") : `<div class="empty-state">No leads yet</div>`;

  // Needs follow-up list
  const overdue = followUp.slice(0, 8);
  document.getElementById("attnPill").textContent = followUp.filter(f=>f.daysInStage >= f.threshold).length;
  document.getElementById("attnList").innerHTML = overdue.length ? overdue.map(f => {
    const isOverdue = f.daysInStage >= f.threshold;
    return `<div class="attn-row">
      <span class="attn-dot ${isOverdue ? "overdue" : ""}"></span>
      <div class="attn-main">
        <div class="attn-name">${f.deal.title}</div>
        <div class="attn-meta">${cleanStageName(f.stage.name)}</div>
      </div>
      <div class="attn-days ${isOverdue ? "overdue" : ""}">${Math.floor(f.daysInStage)}d / ${f.threshold}d</div>
    </div>`;
  }).join("") : `<div class="empty-state">Nothing waiting on a response</div>`;

  document.getElementById("footnote").textContent =
    `Excludes 1 sample deal from Pipedrive's default setup · Auto-refreshes every 15 minutes`;
}

let refreshTimer = null;

async function refreshFromPipedrive(){
  const btn = document.getElementById("refreshBtn");
  const banner = document.getElementById("errorBanner");
  const syncText = document.getElementById("syncText");
  banner.style.display = "none";
  btn.disabled = true;
  syncText.textContent = "Syncing…";
  try{
    const resp = await fetch("/.netlify/functions/pipedrive-data");
    if(!resp.ok) throw new Error("Function error " + resp.status);
    const parsed = await resp.json();

    if(!parsed || !parsed.deals || !parsed.stages) throw new Error("Could not parse Pipedrive response");

    computeAndRender(parsed.deals, parsed.stages);
    syncText.textContent = "Live";
  }catch(err){
    banner.textContent = "Couldn't refresh from Pipedrive (" + err.message + "). Showing the last synced data.";
    banner.style.display = "block";
    syncText.textContent = "Live";
  }finally{
    btn.disabled = false;
  }
}

document.getElementById("refreshBtn").addEventListener("click", refreshFromPipedrive);
refreshTimer = setInterval(refreshFromPipedrive, REFRESH_INTERVAL_MS);
