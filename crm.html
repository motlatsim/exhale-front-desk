<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exhale Memorials — CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --slate:#2B2D37; --green:#20C997; --green-deep:#128267; --cream:#F3EEE8;
    --card:#FFFFFF; --ink:#2B2D37; --ink-soft:#6B6F7B; --hairline:#E7E2D8; --hairline-soft:#F2EDE6;
    --amber:#C98A20; --rust:#B5493A; --rust-pale:#F5E1DD; --panel:#FBF8F4;
    --shadow: 0 1px 2px rgba(43,45,55,.05), 0 10px 28px rgba(43,45,55,.07);
  }
  :root[data-theme="dark"]{
    --cream:#1A1B21; --card:#24252D; --ink:#F3EEE8; --ink-soft:#9A9CA6;
    --hairline:rgba(255,255,255,.09); --hairline-soft:rgba(255,255,255,.06);
    --amber:#E0A548; --rust:#E2776A; --rust-pale:rgba(226,119,106,.16); --panel:#2C2D36;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--green-deep);text-decoration:none}
  a:hover{color:var(--green)}
  input,select,textarea,button{font-family:'Nunito',sans-serif}
  *:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  ::-webkit-scrollbar{height:10px;width:10px}
  ::-webkit-scrollbar-thumb{background:#DCD5C9;border-radius:10px}
  .h2{font-family:'Poppins',sans-serif;font-weight:600}

  /* Gate */
  #gate{position:fixed;inset:0;z-index:999;background:var(--slate);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
  .brand-logo{display:inline-flex;flex-direction:column;align-items:center;line-height:1;position:relative}
  .brand-word{position:relative;display:inline-block;font-family:'Poppins',sans-serif;font-weight:800;font-size:32px;letter-spacing:-0.01em;color:#F3EEE8}
  .brand-arrow{position:absolute;top:-12px;right:-22px;width:21px;height:21px}
  .brand-dot{font-weight:400;font-size:13px;color:#9A9CA6;margin-top:5px;letter-spacing:.01em}
  #gate .gate-title{font-family:'Poppins',sans-serif;color:#F3EEE8;font-size:15px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;opacity:.7}
  #gate form{display:flex;flex-direction:column;gap:12px;width:260px}
  #gate input{padding:12px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#F3EEE8;font-size:14px}
  #gate input::placeholder{color:#9A9CA8}
  #gate button{padding:12px 14px;border-radius:9px;border:none;background:var(--green);color:#12241D;font-weight:800;font-size:13.5px;cursor:pointer}
  #gate button:hover{background:var(--green-deep);color:#fff}
  .gate-error{color:#E6A79A;font-size:12px;text-align:center;min-height:16px}

  /* App shell */
  .app{display:none;min-height:100vh;background:var(--cream)}
  .app.open{display:flex}
  .sidebar{width:236px;flex:0 0 236px;background:var(--slate);padding:22px 14px 18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar .brand-row{display:flex;align-items:center;gap:11px;padding:0 8px}
  .sidebar .brand-logo{align-items:flex-start}
  .sidebar .brand-word{font-size:16px}
  .sidebar .brand-arrow{top:-6px;right:-11px;width:11px;height:11px}
  .sidebar .brand-dot{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:#8E919E;margin-top:2px}
  nav.navlist{display:flex;flex-direction:column;gap:2px}
  .navbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:none;cursor:pointer;border-radius:9px;padding:9px 10px;font-size:13.5px;font-weight:700;background:transparent;color:#B9BAC4}
  .navbtn:hover{background:rgba(255,255,255,.07)}
  .navbtn.active{background:rgba(32,201,151,.16);color:#F3EEE8}
  .navbtn svg{flex:0 0 auto}
  .navbtn .lbl{flex:1}
  .navbtn .badge{font-size:11px;font-weight:700;color:#8E919E}
  .navbtn.active .badge{color:var(--green)}
  .sidebar-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;display:flex;align-items:center;gap:10px}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--green);color:#12241D;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:0 0 30px}
  .sidebar-foot .who{font-size:12.5px;font-weight:700;color:#F3EEE8}
  .sidebar-foot .where{font-size:10.5px;color:#8E919E}
  .theme-toggle{background:none;border:1px solid rgba(255,255,255,.2);color:#B9BAC4;border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 28px}
  .theme-toggle:hover{background:rgba(255,255,255,.08)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:16px;padding:18px 26px;background:color-mix(in srgb, var(--cream) 90%, transparent);border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
  .topbar .titles{flex:1 1 auto;min-width:0}
  .topbar h1{font-family:'Poppins',sans-serif;font-size:20px;font-weight:600;line-height:1.2}
  .topbar .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .actions{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
  .searchbox{width:100%;max-width:260px;min-width:96px;flex:1 1 96px;padding:9px 13px;border-radius:10px;border:1px solid var(--hairline);background:var(--card);font-size:13px;color:var(--ink)}
  .btn-accent{border:none;cursor:pointer;padding:10px 16px;border-radius:10px;background:var(--green);color:#0E2A20;font-weight:800;font-size:13px;white-space:nowrap;flex:0 0 auto}
  .btn-accent:hover{background:var(--green-deep);color:#fff}
  .btn-ghost{border:1px solid var(--hairline);background:var(--card);color:var(--ink);font-weight:700;font-size:12.5px;padding:9px 14px;border-radius:9px;cursor:pointer}
  .btn-ghost:hover{border-color:var(--green)}

  .content{padding:22px 26px 44px;display:flex;flex-direction:column;gap:18px}
  .screen{display:none;flex-direction:column;gap:18px}
  .screen.active{display:flex}
  .error-banner{background:var(--rust-pale);color:var(--rust);border-radius:10px;padding:10px 14px;font-size:12.5px;display:none}
  .error-banner.show{display:block}

  /* Stat cards */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
  .stat-card{background:var(--card);border:1px solid var(--hairline);border-radius:14px;padding:16px 18px}
  .stat-card .lbl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft)}
  .stat-card .val{font-family:'Poppins',sans-serif;font-size:26px;font-weight:600;margin-top:6px}
  .stat-card .note{font-size:12px;color:var(--ink-soft);margin-top:4px}

  .panel{background:var(--card);border:1px solid var(--hairline);border-radius:14px}

  /* Dashboard layout */
  .dash-grid{display:grid;grid-template-columns:1.35fr .95fr;gap:16px;align-items:start}
  @media (max-width:980px){ .dash-grid{grid-template-columns:1fr} }
  .panel-head{padding:15px 18px;border-bottom:1px solid var(--hairline-soft);display:flex;align-items:baseline;gap:10px}
  .panel-head h2{font-size:15px}
  .panel-head .count{font-size:12px;color:var(--ink-soft)}
  .today-row{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--hairline-soft);cursor:pointer}
  .today-row:hover{background:var(--panel)}
  .today-row .bar{width:4px;align-self:stretch;border-radius:4px}
  .today-row .fam{font-weight:700;font-size:13.5px}
  .today-row .act{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
  .today-row .when{font-size:11px;font-weight:700;text-align:right}
  .today-row .stg{font-size:11.5px;color:var(--ink-soft);margin-top:3px;text-align:right}
  .panel-foot{padding:13px 18px;font-size:12.5px;color:var(--ink-soft)}
  .stagebar{cursor:pointer;margin-bottom:9px}
  .stagebar .row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
  .stagebar .row span:last-child{color:var(--ink-soft)}
  .stagebar .track{height:6px;border-radius:6px;background:var(--hairline-soft);margin-top:5px;overflow:hidden}
  .stagebar .fill{height:100%;border-radius:6px}
  .unveil-card{background:var(--slate);border-radius:14px;padding:18px}
  .unveil-card .kicker{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#8E919E;font-weight:700}
  .unveil-card .name{font-family:'Poppins',sans-serif;font-size:17px;font-weight:600;color:#F3EEE8;margin-top:8px;line-height:1.4}
  .unveil-card .meta{font-size:12.5px;color:#B9BAC4;margin-top:6px}
  .unveil-card .rule{height:1px;background:rgba(255,255,255,.12);margin:14px 0}
  .unveil-card .note{font-size:12.5px;color:#B9BAC4;line-height:1.6}

  /* Kanban */
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
  .col{flex:0 0 258px;background:var(--card);border:1px solid var(--hairline);border-radius:14px;display:flex;flex-direction:column}
  .col-head{padding:13px 14px;border-bottom:1px solid var(--hairline-soft)}
  .col-head .row{display:flex;align-items:center;gap:7px}
  .col-head .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .col-head .name{font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:600;flex:1}
  .col-head .cnt{font-size:11.5px;color:var(--ink-soft);font-weight:700}
  .col-head .val{font-size:11px;color:var(--ink-soft);margin-top:5px}
  .col-body{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:70px}
  .col-body.drag-over{background:rgba(32,201,151,.08)}
  .kcard{background:var(--panel);border:1px solid var(--hairline-soft);border-radius:10px;padding:11px 12px;cursor:grab}
  .kcard.touch{cursor:pointer}
  .kcard:hover{border-color:var(--green)}
  .kcard.dragging{opacity:.4}
  .kcard .fam{font-weight:700;font-size:13px}
  .kcard .sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
  .kcard .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:20px}
  .tag.deposit{background:rgba(32,201,151,.16);color:var(--green-deep)}
  .tag.nodeposit{background:var(--rust-pale);color:var(--rust)}
  .tag.age{background:var(--hairline-soft);color:var(--ink-soft);font-weight:700}
  .tag.changes{background:var(--rust-pale);color:var(--rust);font-weight:700}
  .dropzone{border:1px dashed var(--hairline);border-radius:10px;padding:8px;text-align:center;font-size:11px;color:#9A9488}

  /* Families list */
  .filters-row{display:flex;gap:8px;padding:13px 16px;border-bottom:1px solid var(--hairline-soft);flex-wrap:wrap}
  .chip{border:1px solid var(--hairline);background:var(--panel);color:var(--ink);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer}
  .chip.active{background:var(--slate);color:#F3EEE8;border-color:var(--slate)}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
  th{text-align:left;padding:11px 16px;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--hairline-soft);white-space:nowrap}
  th.right, td.right{text-align:right}
  td{padding:12px 16px;border-bottom:1px solid var(--hairline-soft)}
  tr.rowclick{cursor:pointer}
  tr.rowclick:hover{background:var(--panel)}
  .stagepill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px}

  /* Workshop */
  .lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .lane .job{padding:13px 16px;border-bottom:1px solid var(--hairline-soft)}
  .lane .job:last-child{border-bottom:none}
  .job-top{display:flex;gap:8px;align-items:baseline}
  .job-top .fam{font-weight:700;font-size:13px;flex:1}
  .job-top .due{font-size:11px;font-weight:700}
  .job .spec{font-size:12px;color:var(--ink-soft);margin-top:4px}
  .job .prog{display:flex;gap:6px;align-items:center;margin-top:9px}
  .job .prog .track{flex:1;height:5px;border-radius:5px;background:var(--hairline-soft);overflow:hidden}
  .job .prog .fill{height:100%;background:var(--green)}
  .job .owner{font-size:11px;color:var(--ink-soft)}
  .lane-empty{padding:16px;font-size:12px;color:var(--ink-soft)}
  .checklist-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .chip-check{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 9px;border-radius:20px;border:1px solid var(--hairline);color:var(--ink-soft);cursor:pointer}
  .chip-check input{width:auto;margin:0}
  .chip-check.done{background:#E7F6EF;border-color:transparent;color:var(--green-deep)}

  /* Calendar */
  .cal-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .cal-legend{font-size:11.5px;color:var(--ink-soft);display:flex;gap:12px;align-items:center;margin-left:auto}
  .cal-legend .sw{display:flex;gap:5px;align-items:center}
  .cal-legend .dot{width:8px;height:8px;border-radius:2px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .cal-dayname{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft);padding:0 4px 4px}
  .cal-cell{min-height:88px;border:1px solid var(--hairline-soft);border-radius:9px;padding:7px 8px;background:var(--card)}
  .cal-cell.today{background:rgba(32,201,151,.07);border-color:var(--green)}
  .cal-cell.out{background:transparent;border-color:transparent}
  .cal-num{font-size:11.5px;font-weight:700}
  .cal-ev{font-size:10.5px;font-weight:700;line-height:1.3;padding:4px 6px;border-radius:6px;margin-top:4px}

  /* Conversations */
  .msg-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px;align-items:start}
  @media (max-width:900px){ .msg-grid{grid-template-columns:1fr} }
  .thread-row{padding:14px 16px;border-bottom:1px solid var(--hairline-soft);cursor:pointer;border-left:3px solid transparent}
  .thread-row:hover{background:var(--panel)}
  .thread-row.active{background:var(--panel);border-left-color:var(--green)}
  .thread-top{display:flex;gap:8px;align-items:baseline}
  .thread-top .fam{font-weight:700;font-size:13.5px;flex:1}
  .thread-top .when{font-size:11px;color:var(--ink-soft)}
  .thread-prev{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.4}
  .thread-chan{font-size:10.5px;font-weight:700;color:var(--ink-soft);margin-top:7px;letter-spacing:.4px;text-transform:uppercase}
  .thread-pane{display:flex;flex-direction:column;overflow:hidden}
  .thread-pane-head{padding:15px 18px;border-bottom:1px solid var(--hairline-soft)}
  .thread-pane-body{padding:18px;display:flex;flex-direction:column;gap:10px}
  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13px}

  /* Payments */
  .invtable td.due-pos{color:var(--rust);font-weight:700}
  .invtable td.due-zero{color:var(--ink-soft)}

  /* Reports */
  .rep-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;align-items:start}
  @media (max-width:980px){ .rep-grid{grid-template-columns:1fr} }
  .chart-row{display:flex;gap:14px;align-items:flex-end;height:200px;margin-top:22px}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
  .chart-total{font-size:11px;font-weight:700;color:var(--ink-soft)}
  .chart-bar{width:100%;max-width:46px;background:var(--hairline-soft);border-radius:6px 6px 0 0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
  .chart-bar .won{background:var(--green)}
  .chart-month{font-size:11px;color:var(--ink-soft)}
  .town-row{margin-bottom:11px}
  .town-row .row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
  .town-row .row span:last-child{color:var(--ink-soft)}
  .town-row .track{height:6px;border-radius:6px;background:var(--hairline-soft);margin-top:5px;overflow:hidden}
  .town-row .fill{height:100%;background:var(--slate)}
  .dur-row{display:flex;justify-content:space-between;font-size:12.5px;border-bottom:1px solid var(--hairline-soft);padding-bottom:8px;margin-bottom:10px}
  .dur-row span:last-child{font-weight:700}

  /* Mobile */
  .phone-wrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  .phone{width:390px;flex:0 0 390px;max-width:100%;background:var(--slate);border-radius:34px;padding:10px;box-shadow:0 20px 50px rgba(43,45,55,.22)}
  .phone-screen{background:var(--cream);border-radius:26px;overflow:hidden}
  .phone-head{background:var(--slate);padding:12px 20px 14px;color:#F3EEE8}
  .phone-statusrow{display:flex;justify-content:space-between;font-size:11px;color:#8E919E}
  .phone-title-row{display:flex;align-items:center;gap:8px;margin-top:12px}
  .phone-body{padding:14px}
  .phone-card{background:var(--card);border:1px solid var(--hairline);border-radius:12px;padding:13px 14px;margin-bottom:10px}
  .phone-card .top{display:flex;gap:8px;align-items:baseline}
  .phone-card .fam{font-weight:700;font-size:13.5px;flex:1}
  .phone-card .when{font-size:10.5px;font-weight:800}
  .phone-card .act{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.45}
  .phone-card .btnrow{display:flex;gap:8px;margin-top:11px}
  .phone-card .btnrow a{flex:1;border:none;font-weight:800;font-size:12px;padding:9px;border-radius:9px;cursor:pointer;text-align:center;display:block}
  .phone-card .btnrow a.call{background:var(--green);color:#0E2A20}
  .phone-card .btnrow a.wa{border:1px solid var(--hairline);background:var(--card);color:var(--ink)}
  .phone-tabs{display:flex;border-top:1px solid var(--hairline);background:var(--card)}
  .phone-tabs div{flex:1;text-align:center;padding:13px 0 18px;font-size:11px;font-weight:700;color:#9A9488}
  .phone-tabs div.active{color:var(--green-deep)}
  .phone-note{display:flex;gap:10px;margin-bottom:12px}
  .phone-note .dot{width:6px;height:6px;border-radius:50%;background:var(--green);margin-top:7px;flex:0 0 6px}

  /* Settings */
  .settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
  .stage-row{display:flex;align-items:center;gap:10px;border:1px solid var(--hairline-soft);border-radius:9px;padding:9px 12px;background:var(--panel);margin-bottom:7px}
  .stage-row .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .stage-row .name{flex:1;font-size:13px;font-weight:600}
  .stage-row .cnt{font-size:11px;color:var(--ink-soft)}
  .price-row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--hairline-soft);padding-bottom:9px;margin-bottom:10px}
  .price-row .item{font-size:13px;font-weight:700}
  .price-row .note{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
  .price-row .amt{font-size:13px;font-weight:700}
  .town-chip{border:1px solid var(--hairline);background:var(--panel);border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700;display:inline-block;margin:0 8px 8px 0}
  .toggle-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
  .toggle-track{width:36px;height:20px;border-radius:20px;position:relative;flex:0 0 36px;border:none;cursor:pointer;padding:0}
  .toggle-track .knob{position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
  .toggle-lbl{font-size:12.5px;flex:1}

  /* Drawer */
  .drawer-overlay{position:fixed;inset:0;background:rgba(43,45,55,.5);z-index:60;display:none;justify-content:flex-end}
  .drawer-overlay.open{display:flex}
  .drawer{width:520px;max-width:92vw;background:var(--cream);height:100vh;overflow-y:auto;box-shadow:-20px 0 60px rgba(43,45,55,.2)}

</style>

<script>
"use strict";

/* ---------- Gate (shared with Front Desk) ---------- */
function showApp(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").classList.add("open");
  boot();
}
function showGateAgain(msg){
  document.getElementById("app").classList.remove("open");
  document.getElementById("gate").style.display = "flex";
  document.getElementById("gateError").textContent = msg || "";
}
if(localStorage.getItem("exhale_crm_key")) showApp();
document.getElementById("gateForm").addEventListener("submit", async e => {
  e.preventDefault();
  const val = document.getElementById("gatePassword").value;
  const btn = e.target.querySelector("button");
  const errEl = document.getElementById("gateError");
  errEl.textContent = "";
  btn.disabled = true;
  try{
    const res = await fetch("/.netlify/functions/crm-auth", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ password: val })
    });
    const data = await res.json();
    if(!res.ok || !data.ok) throw new Error(data.error || "Incorrect password");
    localStorage.setItem("exhale_crm_key", data.key);
    showApp();
  }catch(err){
    errEl.textContent = err.message === "Incorrect password." ? "Incorrect password" : "Couldn't reach the server — try again.";
    document.getElementById("gatePassword").value = "";
  }finally{
    btn.disabled = false;
  }
});

/* ---------- Helpers ---------- */
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function ZAR(n){ return "R" + Math.round(n||0).toLocaleString("en-ZA").replace(/[, ]/g," "); }
function digits(phone){ return (phone||"").replace(/[^\d+]/g,""); }
function toE164(raw){
  const c = digits(raw);
  if(/^\+27\d{9}$/.test(c)) return c;
  if(/^27\d{9}$/.test(c)) return "+" + c;
  if(/^0\d{9}$/.test(c)) return "+27" + c.slice(1);
  return c;
}
function familyName(name){
  const parts = (name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "Unknown family";
  return parts[parts.length-1] + " family";
}
function initials(name){
  const parts = (name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "··";
  return (parts[0][0] + (parts[1]?parts[1][0]:parts[0][1]||"")).toUpperCase();
}
function daysSince(iso){
  if(!iso) return null;
  return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000));
}
function ageShort(iso){
  if(!iso) return "—";
  const ms = Date.now() - new Date(iso).getTime();
  const h = ms / 3600000;
  if(h < 1) return "just now";
  if(h < 24) return Math.round(h) + "h";
  return Math.round(h/24) + "d";
}
function parseLooseDate(str){
  if(!str) return null;
  const cleaned = str.split("·").pop().trim();
  const d = new Date(cleaned);
  if(!isNaN(d.getTime())) return d;
  const monthYear = cleaned.match(/^([A-Za-z]{3,9})\s+(\d{4})$/);
  if(monthYear){
    const d2 = new Date(monthYear[1] + " 1, " + monthYear[2]);
    if(!isNaN(d2.getTime())) return d2;
  }
  return null;
}
function fmtDate(d){
  return d.toLocaleDateString("en-ZA", { day:"numeric", month:"short", year:"numeric" });
}
function plural(n, word){ return n + " " + (n === 1 ? word : (word === "family" ? "families" : word + "s")); }
function wantingLabel(c){ return c.memorialSpec ? c.memorialSpec : c.interest; }
function inMemoryOfLabel(c){
  if(!c.deceasedName) return "";
  const years = [c.dateOfBirth, c.dateOfDeath].filter(Boolean).join(" – ");
  return c.deceasedName + (years ? " · " + years : "");
}

async function apiFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({ "x-crm-key": localStorage.getItem("exhale_crm_key") || "" }, opts.headers || {});
  const res = await fetch(url, opts);
  if(res.status === 401){
    localStorage.removeItem("exhale_crm_key");
    showGateAgain("Session expired — please log in again.");
    throw new Error("Session expired — please log in again.");
  }
  return res;
}

async function loadCases(){
  const resp = await apiFetch("/.netlify/functions/notion-enquiries");
  if(!resp.ok) throw new Error("Function error " + resp.status);
  const parsed = await resp.json();
  if(!parsed || !parsed.enquiries) throw new Error("Could not parse response");
  state.cases = parsed.enquiries.map(normalize);
}

async function loadConversations(){
  try{
    const resp = await apiFetch("/.netlify/functions/peach-data");
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || "Peach error " + resp.status);
    const list = Array.isArray(data) ? data : (data.conversations || data.data || data.results || []);
    state.conversations = list.map(c => ({
      id: c.conversation_id || c.id,
      name: (c.contact && (c.contact.name || c.contact.full_name)) || c.name || c.phone_number || "Unknown",
      phone: (c.contact && c.contact.phone_number) || c.phone_number || "",
      status: c.status || "open",
      escalated: !!c.escalated,
      updatedAt: c.updated_at || c.last_message_at || c.updated_since || null,
      preview: (c.last_message && (c.last_message.text || c.last_message.body)) || c.preview || ""
    }));
    state.convError = "";
  }catch(err){
    state.conversations = [];
    state.convError = err.message;
  }
}

async function loadCatalog(){
  try{
    const resp = await apiFetch("/.netlify/functions/catalog-list");
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || "Catalog error " + resp.status);
    state.catalog = data.items || [];

}

/* ---------- Derived data ---------- */
function liveCases(){ return state.cases.filter(c => c.stage !== "Lost"); }
function stageCount(st){ return state.cases.filter(c => c.stage === st).length; }

function matchesSearch(c){
  const q = state.query.trim().toLowerCase();
  if(!q) return true;
  return (c.family + c.contact + c.phone + c.town + c.deceasedName).toLowerCase().includes(q);
}
function searchFiltered(list){
  return list.filter(matchesSearch);
}

function attentionList(){
  const items = [];
  liveCases().forEach(c => {
    let reason = null, score = 0, when = "", color = "#128267";
    if(c.stage === "Lead"){
      if(!c.phoneValid){ reason = "Phone number looks off — try the email instead."; score = 95; when = "First"; color = "#B5493A"; }
      else { reason = "Nobody has called " + c.contact.split(" ")[0] + " yet — " + c.interest.toLowerCase() + " enquiry, " + ageShort(c.submittedAt) + " old."; score = 90; when = "First"; color = "#B5493A"; }
    } else if(["Quotation","Design Selection"].includes(c.stage) && c.days >= 5){
      reason = "Quote has been sitting " + c.days + " days — worth a follow-up call."; score = 70; when = "Today"; color = "#C98A20";
    } else if(c.stage === "Deposit Confirmed" && !c.deposit){
      reason = "Marked Deposit Confirmed but no deposit is recorded — check Peach."; score = 68; when = "Today"; color = "#C98A20";
    } else if(["Quotation"].includes(c.stage) && !c.deposit && c.days >= 2){
      reason = "Quoted, no deposit yet — a gentle nudge could help."; score = 55; when = "This week"; color = "#128267";
    }
    const installed = parseLooseDate(c.installedDate);
    if(installed){
      const diffDays = Math.round((installed - Date.now()) / 86400000);
      if(diffDays >= 0 && diffDays <= 5){
        items.push({ c, reason: "Install is " + (diffDays === 0 ? "today" : diffDays === 1 ? "tomorrow" : "in " + diffDays + " days") + " — confirm the crew and materials.", score: 92, when: diffDays === 0 ? "Today" : fmtDate(installed), color:"#C98A20" });
      }
    }
    const unveil = parseLooseDate(c.unveiling);
    if(unveil){
      const diffDays = Math.round((unveil - Date.now()) / 86400000);
      if(diffDays >= 0 && diffDays <= 10){
        items.push({ c, reason: "Unveiling " + (diffDays === 0 ? "is today" : "in " + diffDays + " days") + " — hold the date for the family.", score: 88, when: fmtDate(unveil), color:"#128267" });
      }
    }
    if(c.paymentOption === "Laybuy" && c.installments && c.installments.length){
      const overdue = c.installments.filter(i => !i.paid && i.due && new Date(i.due) < Date.now());
      const dueSoon = c.installments.filter(i => !i.paid && i.due && new Date(i.due) >= Date.now() && new Date(i.due) - Date.now() <= 3*86400000);
      if(overdue.length){
        const oldest = overdue.sort((a,b) => new Date(a.due) - new Date(b.due))[0];
        items.push({ c, reason: "Lay-buy installment of " + ZAR(oldest.amount) + " was due " + fmtDate(new Date(oldest.due)) + " — follow up.", score: 85, when: "Overdue", color:"#B5493A" });
      } else if(dueSoon.length){
        const next = dueSoon.sort((a,b) => new Date(a.due) - new Date(b.due))[0];
        items.push({ c, reason: "Lay-buy installment of " + ZAR(next.amount) + " is due " + fmtDate(new Date(next.due)) + ".", score: 60, when: "Due soon", color:"#C98A20" });
      }
    }
    if(c.signoffStatus === "Changes Requested"){
      items.push({ c, reason: "The family asked for changes to the design" + (c.signoffNote ? " — “" + c.signoffNote + "”" : ".") + " Revise the design and send it again.", score: 93, when: c.signoffDate ? fmtDateISO(c.signoffDate) : "Today", color:"#B5493A" });
    } else if(c.signoffStatus === "Approved" && c.stage !== "Manufacturing" && !["Ready to Install","Installation","After-Installation Service"].includes(c.stage)){
      items.push({ c, reason: "The family approved the design — check if the deposit is clear so production can start.", score: 65, when: c.signoffDate ? fmtDateISO(c.signoffDate) : "Today", color:"#128267" });
    }
    if(reason) items.push({ c, reason, score, when, color });
  });
  items.sort((a,b) => b.score - a.score);
  const seen = new Set(); const out = [];
  for(const it of items){ if(seen.has(it.c.id)) continue; seen.add(it.c.id); out.push(it); if(out.length >= 8) break; }
  return out;
}

        cs.map(c => cardHtml(c)).join("") +
      '</div>' +
    '</div>';
  }).join("") + '</div>';

  el.querySelectorAll(".kcard").forEach(card => {
    card.addEventListener("click", () => openDrawer(card.dataset.id));
    if(!IS_TOUCH){
      card.addEventListener("dragstart", e => { card.classList.add("dragging"); e.dataTransfer.setData("text/plain", card.dataset.id); });
      card.addEventListener("dragend", () => card.classList.remove("dragging"));
    }
  });
  el.querySelectorAll("[data-stage-drop]").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("drag-over"); });
    col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
    col.addEventListener("drop", async e => {
      e.preventDefault(); col.classList.remove("drag-over");
      const id = e.dataTransfer.getData("text/plain");
      const newStage = col.dataset.stageDrop;
      const c = state.cases.find(x => x.id === id);
      if(!c || c.stage === newStage) return;
      const prev = c.stage;
      c.stage = newStage; render();
      try{ await updateCase(id, { status:newStage }); }
      catch(err){ c.stage = prev; render(); alert("Couldn't move that card — try again."); }
    });
  });
}

/* ---------- Screen: Calendar ---------- */
function renderCalendar(){
  const el = document.getElementById("screen-calendar");
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayNum = now.getDate();

  const events = {};
  function addEvent(d, label, bg, ink){
    if(d.getFullYear() !== year || d.getMonth() !== month) return;
    const n = d.getDate();
    (events[n] = events[n] || []).push({ label, bg, ink });
  }
  state.cases.forEach(c => {
    const installed = parseLooseDate(c.installedDate);
    if(installed) addEvent(installed, "Install · " + c.family.replace(" family",""), "rgba(32,201,151,.18)", "#0F6B54");
    const unveil = parseLooseDate(c.unveiling);
    if(unveil) addEvent(unveil, "Unveiling · " + c.family.replace(" family",""), "#2B2D37", "#F3EEE8");
  });

  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);

  el.innerHTML = '<div class="panel" style="padding:18px">' +
    '<div class="cal-head"><h2 class="h2" style="font-size:16px">' + now.toLocaleDateString("en-ZA",{month:"long",year:"numeric"}) + '</h2>' +
      '<span style="font-size:12.5px;color:var(--ink-soft)">Installs and unveilings on record</span>' +
      '<span class="cal-legend"><span class="sw"><span class="dot" style="background:#20C997"></span>Install</span><span class="sw"><span class="dot" style="background:#2B2D37"></span>Unveiling</span></span>' +
    '</div>' +
    '<div class="cal-grid">' +
      ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => '<div class="cal-dayname">' + d + '</div>').join("") +
      cells.map(n => {
        if(!n) return '<div class="cal-cell out"></div>';
        const isToday = n === todayNum;
        const evs = events[n] || [];
        return '<div class="cal-cell' + (isToday?" today":"") + '"><div class="cal-num">' + n + '</div>' +
          evs.map(ev => '<div class="cal-ev" style="background:' + ev.bg + ';color:' + ev.ink + '">' + esc(ev.label) + '</div>').join("") +
        '</div>';
      }).join("") +
    '</div></div>';
}

  const rows = state.cases.filter(c => c.paymentOption === "Laybuy" && c.installments && c.installments.length && matchesSearch(c));

    return { month: d.toLocaleDateString("en-ZA",{month:"short"}), total: total.length, won: won.length };

  const durByStage = STAGES.filter(s=>s!=="Lost").map(s => {
    const cs = state.cases.filter(c => c.stage === s);

  el.innerHTML = '<div class="rep-grid">' +

        '<div style="margin-top:14px">' + townCounts.map(t =>

/* ---------- Catalog modal (Settings) ---------- */
function openCatalogModal(id){
  const item = id ? state.catalog.find(x => x.id === id) : null;
  state.catalogEditingId = id || null;
  document.getElementById("catalogModalTitle").textContent = item ? "Edit catalog item" : "New catalog item";
  document.getElementById("ciName").value = item ? item.name : "";
  document.getElementById("ciCategory").value = item ? item.category || "Tombstones" : "Tombstones";
  document.getElementById("ciPrice").value = item ? item.price || "" : "";
  document.getElementById("ciDescription").value = item ? item.description : "";
  document.getElementById("ciActive").checked = item ? item.active !== false : true;
  document.getElementById("catalogStatus").textContent = "";
  const photoField = document.getElementById("ciPhotoField");
  photoField.style.display = item ? "block" : "none";
  renderCatalogPhotoGrid(item);
  document.getElementById("catalogOverlay").classList.add("open");
}
function closeCatalogModal(){ document.getElementById("catalogOverlay").classList.remove("open"); }
function renderCatalogPhotoGrid(item){
  const grid = document.getElementById("ciPhotoGrid");
  grid.innerHTML = (item && item.photoUrl) ? '<div class="photo-thumb"><img src="' + esc(item.photoUrl) + '"></div>' : "";
}
document.getElementById("catalogClose").addEventListener("click", closeCatalogModal);
document.getElementById("catalogOverlay").addEventListener("click", e => { if(e.target.id === "catalogOverlay") closeCatalogModal(); });
document.getElementById("catalogSaveBtn").addEventListener("click", async () => {
  const status = document.getElementById("catalogStatus");
  const name = document.getElementById("ciName").value.trim();
  if(!name){ status.textContent = "Name is required."; status.className = "save-status err"; return; }
  status.textContent = "Saving…"; status.className = "save-status";
  try{
    const data = await saveCatalogItem({
      id: state.catalogEditingId || undefined,
      name,
      category: document.getElementById("ciCategory").value,
      price: document.getElementById("ciPrice").value,
      description: document.getElementById("ciDescription").value.trim(),
      active: document.getElementById("ciActive").checked
    });
    state.catalogEditingId = data.id;
    await loadCatalog();
    renderSettings();
    document.getElementById("ciPhotoField").style.display = "block";
    renderCatalogPhotoGrid(state.catalog.find(x => x.id === data.id));
    status.textContent = "";
    document.getElementById("catalogStatus").textContent = "Saved ✓";
    document.getElementById("catalogStatus").className = "save-status ok";
  }catch(err){
    status.textContent = "Couldn't save: " + err.message;
    status.className = "save-status err";
  }
});
document.getElementById("ciPhotoInput").addEventListener("change", async e => {
  const file = e.target.files[0];
  if(!file || !state.catalogEditingId) return;
  const status = document.getElementById("ciPhotoStatus");
  status.textContent = "Uploading…"; status.className = "save-status";
  try{
    await uploadFile(state.catalogEditingId, "Photo", null, file);
    await loadCatalog();
    renderCatalogPhotoGrid(state.catalog.find(x => x.id === state.catalogEditingId));
    status.textContent = "Uploaded ✓"; status.className = "save-status ok";
  }catch(err){
    status.textContent = "Couldn't upload: " + err.message; status.className = "save-status err";
  }
  e.target.value = "";
});

/* ---------- Lay-buy installments ---------- */
function readInstallmentsFromDOM(){
  return Array.from(document.querySelectorAll("#installmentsBody .inst-row")).map(row => ({
    due: row.querySelector(".inst-due").value,
    amount: Number(row.querySelector(".inst-amount").value) || 0,
    paid: row.querySelector(".inst-paid").checked
  }));
}
function renderInstallments(list, quotedValue){
  const body = document.getElementById("installmentsBody");
  body.innerHTML = list.length ? list.map((inst, i) =>
    '<div class="inst-row" data-i="' + i + '">' +
      '<input type="date" class="inst-due" value="' + esc(inst.due || "") + '">' +
      '<input type="number" class="inst-amount" placeholder="Amount (R)" value="' + (inst.amount || "") + '">' +
      '<label class="inst-paid-label"><input type="checkbox" class="inst-paid"' + (inst.paid ? " checked" : "") + '> Paid</label>' +
      '<button type="button" class="inst-remove" data-i="' + i + '">Remove</button>' +
    '</div>'
  ).join("") : '<div class="empty-state" style="padding:10px 0">No installments yet.</div>';

  body.querySelectorAll(".inst-remove").forEach(btn => btn.addEventListener("click", () => {
    const updated = readInstallmentsFromDOM();
    updated.splice(Number(btn.dataset.i), 1);
    renderInstallments(updated, quotedValue);
  }));
  body.querySelectorAll(".inst-due, .inst-amount, .inst-paid").forEach(el => el.addEventListener("change", () => {
    updateInstSummary(readInstallmentsFromDOM(), quotedValue);
  }));
  updateInstSummary(list, quotedValue);
}
function updateInstSummary(list, quotedValue){
  const summary = document.getElementById("instSummary");
  if(!summary) return;
  const total = list.reduce((a,i) => a + (Number(i.amount) || 0), 0);
  const paid = list.filter(i => i.paid).reduce((a,i) => a + (Number(i.amount) || 0), 0);
  const diff = Math.round((quotedValue - total) * 100) / 100;
  summary.textContent = plural(list.length, "installment") + " · " + ZAR(total) + " scheduled · " + ZAR(paid) + " paid" +
    (diff !== 0 ? " · " + ZAR(Math.abs(diff)) + (diff > 0 ? " short of the quoted value" : " over the quoted value") : "");
  summary.className = "inst-summary" + (diff !== 0 ? " warn" : "");
}

  totalEl.innerHTML = '<span>Proposal total</span><span>' + ZAR(total) + '</span>';

function renderSignoffPanel(c){
  if(!c.signoffToken){
    return '<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px">' +
        (c.designImages.length ? "Not sent yet." : "Upload a design image above first.") +
      '</div>' +
      '<button class="btn-ghost" id="sendSignoffBtn"' + (c.designImages.length ? "" : " disabled") + '>Send for sign-off</button>';
  }
  const link = location.origin + "/approve.html?token=" + encodeURIComponent(c.signoffToken);
  const statusClass = c.signoffStatus === "Approved" ? "approved" : (c.signoffStatus === "Changes Requested" ? "changes" : "sent");
  return '<span class="signoff-badge ' + statusClass + '">' + esc(c.signoffStatus || "Sent") + '</span>' +
    (c.signoffDate ? '<span style="font-size:11.5px;color:var(--ink-soft);margin-left:8px">' + fmtDateISO(c.signoffDate) + '</span>' : "") +
    (c.signoffNote ? '<div style="font-size:12.5px;margin-top:8px;padding:10px 12px;background:var(--panel);border-radius:8px">"' + esc(c.signoffNote) + '"</div>' : "") +
    '<div class="signoff-link-row">' +
      '<input readonly value="' + esc(link) + '" onclick="this.select()">' +
      '<button class="btn-ghost" id="copySignoffBtn">Copy link</button>' +
      '<button class="btn-ghost" id="sendSignoffBtn">Send again</button>' +
    '</div>';
}
function generateRandomToken(){
  const bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
}
async function sendForSignoff(c){
  const token = c.signoffToken || generateRandomToken();
  try{
    await updateCase(c.id, { signoff_token: token, signoff_status: "Sent" });
    c.signoffToken = token; c.signoffStatus = "Sent";
    renderDrawer();
  }catch(err){
    alert("Couldn't send for sign-off — try again.");
  }
}
function copySignoffLink(c){
  const link = location.origin + "/approve.html?token=" + encodeURIComponent(c.signoffToken);
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).catch(() => {});
  const btn = document.getElementById("copySignoffBtn");
  if(btn){
    const orig = btn.textContent;
    btn.textContent = "Copied ✓";
    setTimeout(() => { if(document.body.contains(btn)) btn.textContent = orig; }, 1500);
  }
}

  }catch(err){
    if(body) body.innerHTML = '<div class="empty-state" style="padding:10px 0">Couldn\'t load payments (' + esc(err.message) + ').</div>';

document.getElementById("paymentSaveBtn").addEventListener("click", async () => {
  const status = document.getElementById("paymentStatus");
  const caseId = document.getElementById("paymentOverlay").dataset.caseId;
  const c = state.cases.find(x => x.id === caseId);
  const amount = document.getElementById("payAmount").value;
  const method = document.getElementById("payMethod").value;
  const date = document.getElementById("payDate").value;
  const proofFile = document.getElementById("payProofInput").files[0];
  if(!amount || Number(amount) <= 0){ status.textContent = "Enter an amount."; status.className = "save-status err"; return; }
  if(!date){ status.textContent = "Enter a date."; status.className = "save-status err"; return; }
  if(!proofFile){ status.textContent = "A proof image is required — no cash is taken without one."; status.className = "save-status err"; return; }
  status.textContent = "Saving…"; status.className = "save-status";
  try{
    const res = await apiFetch("/.netlify/functions/payments-add", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ family_id: caseId, amount, method, date, label: c.family + " – " + date })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || "Couldn't log the payment.");
    await uploadFile(data.id, "Receipt Proof", null, proofFile);
    if(data.totalPaid !== null && data.totalPaid !== undefined) c.paid = data.totalPaid;
    document.getElementById("paymentOverlay").classList.remove("open");
    render(); renderDrawer();
  }catch(err){
    status.textContent = "Couldn't save: " + err.message;
    status.className = "save-status err";
  }
});

/* ---------- Estimate / invoice documents ---------- */
function addDays(iso, days){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function fmtDateISO(iso){
  if(!iso) return "—";
  return fmtDate(new Date(iso + "T00:00:00"));
}
function nextDocNumber(prefix, field){
  let max = 0;
  state.cases.forEach(c => {
    const m = (c[field] || "").match(/(\d+)$/);
    if(m) max = Math.max(max, parseInt(m[1], 10));
  });
  return prefix + "-" + String(max + 1).padStart(4, "0");
}
async function viewDocument(c, type){
  const numField = type === "Estimate" ? "estimateNumber" : "invoiceNumber";
  const dateField = type === "Estimate" ? "estimateDate" : "invoiceDate";
  if(!c[numField]){
    const prefix = type === "Estimate" ? "EST" : "INV";
    const num = nextDocNumber(prefix, numField);
    const dateIso = new Date().toISOString().slice(0,10);
    const patch = {};
    patch[type === "Estimate" ? "estimate_number" : "invoice_number"] = num;
    patch[type === "Estimate" ? "estimate_date" : "invoice_date"] = dateIso;
    try{
      await updateCase(c.id, patch);
      c[numField] = num; c[dateField] = dateIso;
      render();
    }catch(err){ alert("Couldn't create the " + type.toLowerCase() + " — try again."); return; }
  }
  renderPrintDoc(c, type);
  document.getElementById("printDoc").classList.add("open");
}
async function saveProposalItems(c, opts){
  opts = opts || {};
  const items = readProposalItemsFromDOM().filter(i => i.name.trim());
  const total = items.reduce((a,i) => a + (Number(i.qty)||0) * (Number(i.price)||0), 0);
  const patch = { proposal_items: JSON.stringify(items), quoted_value: total };
  if(opts.ensureEstimate && !c.estimateNumber){
    patch.estimate_number = nextDocNumber("EST", "estimateNumber");
    patch.estimate_date = new Date().toISOString().slice(0,10);
  }
  if(opts.ensureTracker && !c.trackerToken){
    patch.tracker_token = generateRandomToken();
  }
  await updateCase(c.id, patch);
  c.proposalItems = items;
  c.value = total;
  if(patch.estimate_number){ c.estimateNumber = patch.estimate_number; c.estimateDate = patch.estimate_date; }
  if(patch.tracker_token){ c.trackerToken = patch.tracker_token; }
  return { items, total };
}
async function saveProposalOnly(c){
  const status = document.getElementById("proposalSaveStatus");
  status.textContent = "Saving…"; status.className = "save-status";
  try{
    await saveProposalItems(c, {});
    render(); renderDrawer();
    document.getElementById("proposalSaveStatus").textContent = "Saved ✓";
    document.getElementById("proposalSaveStatus").className = "save-status ok";

    status.textContent = "Couldn't save: " + err.message;
    status.className = "save-status err";
  }
}

    status.textContent = "Couldn't save: " + err.message;

}
async function shareEstimateWhatsApp(c){
  const status = document.getElementById("proposalSaveStatus");
  const items = readProposalItemsFromDOM().filter(i => i.name.trim());
  if(!items.length){ status.textContent = "Add at least one item first."; status.className = "save-status err"; return; }
  const waWindow = c.phone ? window.open("", "_blank") : null;
  status.textContent = "Saving…"; status.className = "save-status";
  try{
    const { total } = await saveProposalItems(c, { ensureEstimate: true, ensureTracker: true });
    render(); renderDrawer();
    const link = location.origin + "/track.html?token=" + encodeURIComponent(c.trackerToken);
    if(c.phone && waWindow){
      const message = "Hi " + (c.contact.split(" ")[0] || "") + ", here's the estimate for " + c.family + " — " + ZAR(total) + " total. You can view it and track progress here: " + link;
      waWindow.location = "https://wa.me/" + toE164(c.phone).replace("+","") + "?text=" + encodeURIComponent(message);
    }else{
      if(waWindow) waWindow.close();
      alert("Estimate saved (" + ZAR(total) + " total). No phone on file to share via WhatsApp — copy the link from the Family tracker link panel below instead.");
    }
  }catch(err){
    if(waWindow) waWindow.close();
    status.textContent = "Couldn't save: " + err.message;
    status.className = "save-status err";
  }
}
async function shareEstimateEmail(c){

    window.location.href = "mailto:" + encodeURIComponent(c.email || "") + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  }catch(err){

  }
}

  const status = document.getElementById("proposalSaveStatus");

document.getElementById("docPrintBtn").addEventListener("click", () => window.print());

function renderPrintDoc(c, type){
  const isInvoice = type === "Invoice";
  const num = isInvoice ? c.invoiceNumber : c.estimateNumber;
  const dateIso = isInvoice ? c.invoiceDate : c.estimateDate;
  const dueIso = addDays(dateIso, isInvoice ? 7 : 14);
  const itemDesc = c.memorialSpec || (c.interest + (c.deceasedName ? " for the late " + c.deceasedName : ""));
  const items = (c.proposalItems || []).filter(i => i.name && i.name.trim());
  const docTotal = items.length ? items.reduce((a,i) => a + (Number(i.qty)||0) * (Number(i.price)||0), 0) : c.value;
  const due = docTotal - c.paid;
  const rows = items.length ? items.map((item, i) =>
    '<tr>' +
      '<td>' + (i+1) + '</td>' +
      '<td class="doc-item-name">' + esc(item.name) + '</td>' +
      '<td>' + esc(item.description || "") + '</td>' +
      '<td class="right">' + (Number(item.qty)||0) + '</td>' +
      '<td class="right">' + ZAR(item.price) + '</td>' +
      '<td class="right">' + ZAR((Number(item.qty)||0) * (Number(item.price)||0)) + '</td>' +
    '</tr>'
  ).join("") : (
    '<tr>' +
      '<td>1</td>' +
      '<td class="doc-item-name">' + esc(c.interest) + '</td>' +
      '<td>' + esc(itemDesc) + '</td>' +
      '<td class="right">1</td>' +
      '<td class="right">' + (c.value ? ZAR(c.value) : "—") + '</td>' +
      '<td class="right">' + (c.value ? ZAR(c.value) : "—") + '</td>' +
    '</tr>'
  );

  const page = document.getElementById("docPage");
  page.innerHTML =
    '<div class="doc-head">' +
      '<div>' +
        '<div class="doc-title">' + type.toUpperCase() + '</div>' +
        '<div class="doc-biz-name">' + esc(BUSINESS.name) + '</div>' +
        BUSINESS.addressLines.map(l => '<div class="doc-biz-line">' + esc(l) + '</div>').join("") +
      '</div>' +
      '<div>' +
        '<div class="doc-brand"><svg width="18" height="18" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M28 13 H37.5 V30" stroke="#20C997" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path><path d="M14 24 H23 V26.5" stroke="#20C997" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="doc-brand-word">exhale</span></div>' +
        '<div class="doc-contact">' +
          '<div>' + esc(BUSINESS.email) + '</div>' +
          '<div>' + esc(BUSINESS.phone) + '</div>' +
          '<div>' + esc(BUSINESS.website) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="doc-box">' +
      '<div class="doc-box-label">Bill to</div>' +
      '<div class="doc-bold">' + esc(c.contact) + '</div>' +
      '<div class="doc-line">' + esc(c.family) + '</div>' +
      (c.town ? '<div class="doc-line">' + esc(c.town) + '</div>' : "") +
      (c.phone ? '<div class="doc-line">' + esc(c.phone) + '</div>' : "") +
      '<div class="doc-divider"></div>' +
      '<div class="doc-detail-row"><span>' + type + ' no.</span><span>' + esc(num) + '</span></div>' +
      '<div class="doc-detail-row"><span>' + type + ' date</span><span>' + fmtDateISO(dateIso) + '</span></div>' +
      '<div class="doc-detail-row"><span>' + (isInvoice ? "Due date" : "Valid until") + '</span><span>' + fmtDateISO(dueIso) + '</span></div>' +
    '</div>' +
    '<div class="doc-table-wrap"><table class="doc-table">' +
      '<thead><tr><th>#</th><th>Product or service</th><th>Description</th><th class="right">Qty</th><th class="right">Rate</th><th class="right">Amount</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table></div>' +
    '<div class="doc-totals">' +
      '<div class="doc-total-row"><span>Total</span><span>' + ZAR(docTotal) + '</span></div>' +
      (isInvoice ? (
        '<div class="doc-total-row"><span>Payment</span><span>-' + ZAR(c.paid) + '</span></div>' +
        '<div class="doc-total-row doc-total-bold"><span>Balance due</span><span>' + ZAR(Math.max(0,due)) + '</span></div>' +
        '<div class="doc-status ' + (due > 0 ? "due" : "ok") + '">' + (due > 0 ? "Balance due" : "Paid in Full") + '</div>'
      ) : "") +
    '</div>' +
    (isInvoice && due > 0 ? (
      '<div class="doc-banking">' +
        '<div class="doc-box-label">Payment details</div>' +
        '<div>Bank: ' + esc(BUSINESS.bank) + '</div>' +
        '<div>Account name: ' + esc(BUSINESS.accountName) + '</div>' +
        '<div>Account number: ' + esc(BUSINESS.accountNumber) + '</div>' +
        '<div>Branch code: ' + esc(BUSINESS.branchCode) + '</div>' +
        '<div>Reference: ' + esc(num) + '</div>' +
      '</div>'
    ) : "") +
    '<div class="doc-footnote">' + (isInvoice ? "Thank you for trusting us with your family's memorial." : "This estimate is valid until the date shown above.") + '</div>';
}
